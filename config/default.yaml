version: 1
app:
  locale: ja
  autostart_pipeline: true
  fullscreen: false
sensor: {width: 320, height: 320}
input:
  source: auto
  metavision:
    delta_t_us: 20000
    input_path: ""
  poll_timeout_ms: 50
  stall_timeout_ms: 1500
  disconnect_timeout_ms: 5000
  reconnect_interval_ms: 3000
  max_open_retries: 10
  dummy:
    mode: demo
    scenario: keyboard_focus
    loop: true
    seed: 20260726
    batch_interval_ms: 20
    rate_scale: 1.0
  file: {path: null, speed: 1.0, loop: true}
  hdf5: {path: null, events_dataset: /events, speed: 1.0, loop: false}
  udp: {bind_host: "0.0.0.0", allowed_host: "127.0.0.1", allow_public_sender: false, port: 5005, reassembly_timeout_ms: 500, max_batch_events: 200000, max_pending_batches: 64}
udp:
  output:
    enabled: false
    destination_host: "127.0.0.1"
    allow_public_destination: false
    destination_port: 5005
    max_datagram_bytes: 1200
    stream_id: 1
pipeline: {queue_size: 64, queue_overflow: drop_oldest}
window:
  window_ms: 200
  stride_ms: 200
  max_events_per_window: 200000
  grid_cols: 16
  grid_rows: 16
regions:
  - {id: keyboard, rect: [0.25, 0.62, 0.75, 1.00]}
  - {id: mouse, rect: [0.75, 0.60, 1.00, 1.00]}
  - {id: center, rect: [0.30, 0.25, 0.70, 0.62]}
  - {id: left, rect: [0.00, 0.00, 0.30, 0.62]}
  - {id: right, rect: [0.70, 0.00, 1.00, 0.60]}
features:
  ema_short_seconds: 1.0
  ema_long_seconds: 10.0
  history_seconds: 60.0
  bbox_percentile: 0.05
  voxel: {enabled: false, time_bins: 4, spatial_scale: 4}
estimation:
  estimator: rule
  model_path: null
  warmup_seconds: 3.0
  idle_eps: 100.0
  away_seconds: 30.0
  focus_min_eps: 400.0
  high_activity_eps: 5000.0
  focus_regions: [keyboard, mouse]
  focus_region_share: 0.60
  focus_min_seconds: 5.0
  focus_max_bbox_area_ratio: 0.20
  focus_max_activity_cv: 0.60
  background_residual_eps: 15000.0
  metavision:
    idle_eps: 10000.0
    focus_min_eps: 15000.0
    focus_region_share: 0.0
    focus_max_bbox_area_ratio: 0.75
    focus_max_activity_cv: 3.0
break:
  enabled: true
  after_seconds: 1500.0
  reset_seconds: 180.0
  snooze_seconds: 300.0
  demo_scale: 1.0
smoothing:
  vote_window_size: 5
  vote_min_count: 3
  enter_confidence: 0.50
  exit_confidence: 0.35
  confidence_ema_seconds: 2.0
  min_dwell_seconds: {default: 3.0, away: 5.0}
character:
  renderer: gif
  assets_dir: assets/character
  scale: 4
ui:
  theme: dark
  widget:
    width: 460
    height: 250
    opacity: 0.96
    show_history: true
    character_size: 120
    minimized_size: 96
    last_position: null
    minimized: false
  detail: {max_preview_points: 200000, history_seconds: 300, refresh_hz: 10, character_size: 120, calibration_seconds: 10.0}
privacy:
  save_raw_events: false
  save_features: false
  history_retention_minutes: 60
  allow_external_send: false
  show_caveat: true
logging:
  level: INFO
  file_enabled: true
  dir: null
  max_bytes: 1048576
  backup_count: 3
  log_features: false
debug: {enabled: false, force_status: null, break_start_seconds: 3000}
